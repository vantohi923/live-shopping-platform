version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: liveshop-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: liveshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: liveshop-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: